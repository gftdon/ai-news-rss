name: Generate RSS Feeds

on:
  schedule:
    # Run every 15 minutes (off-peak minute to reduce GitHub scheduler delays)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

# Skip a new run if the previous one is still in progress
concurrency:
  group: generate-feeds
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Generate RSS feeds
        run: node generate-all.js

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          commit_message: 'chore: update RSS feeds [skip ci]'
